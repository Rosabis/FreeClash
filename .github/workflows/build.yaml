name: build

on:
  push:
    tags:
      - 'v*'
    workflow_dispatch 
env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.44.4'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test release notes generation
        shell: bash
        run: bash .github/scripts/generate_release_notes_test.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Validate local Flutter packages
        shell: bash
        run: |
          for package in plugins/proxy plugins/wifi_ssid plugins/window_ext plugins/setup; do
            (
              cd "$package"
              flutter pub get
              flutter analyze --no-fatal-infos
            )
          done

      - name: Run local plugin tests
        shell: bash
        run: |
          (
            cd plugins/proxy
            flutter test --reporter expanded
          )
          (
            cd plugins/wifi_ssid
            flutter test --reporter expanded
          )

      - name: Validate setup build tool
        working-directory: plugins/setup/buildkit/build_tool
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go test .
          go vet .

      - name: Validate Rust components
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo test --manifest-path services/helper/Cargo.toml
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ test, windows-helper-test ]
    runs-on: Windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Enable git long paths (Windows)
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        run: dart setup.dart windows ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-amd64
          path: ./dist
          overwrite: true

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release.md
        if: ${{ env.IS_STABLE == 'true' }}
        shell: bash
        run: |
          pre_tag=$(
            curl --silent "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" |
              sed -nE 's/.*"tag_name": "([^"]+)".*/\1/p'
          )
          bash .github/scripts/generate_release_notes.sh "$pre_tag" release.md

      - name: Patch release.md
        if: ${{ env.IS_STABLE == 'true' }}
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed -e "s|VERSION|$version|g" -e "s|REPO|${GITHUB_REPOSITORY}|g" ./.github/release_template.md >> release.md

      - name: Generate sha256
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: './release.md'
